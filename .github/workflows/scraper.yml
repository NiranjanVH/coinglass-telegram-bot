name: CoinGlass Telegram Scraper

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_coinglass]

permissions:
  contents: read

concurrency:
  group: coinglass-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache Python environment
        id: python-env-cache
        uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        if: steps.python-env-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt

      - name: Ensure Playwright Chromium is installed
        run: .venv/bin/playwright install chromium

      - name: Restore CoinGlass session
        env:
          SESSION: ${{ secrets.COINGLASS_STATE_B64 }}
        run: |
          echo "$SESSION" | base64 -d > coinglass_state.json

      - name: Run all four timeframes
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: .venv/bin/python run_parallel.py
